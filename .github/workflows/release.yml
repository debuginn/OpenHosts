name: Release

# Tag pushes (v*) notarize, verify, and publish a GitHub Release.
# workflow_dispatch is a dry run: it never creates a Release or uploads assets.
# Set force_notary_fail to submit an unsigned, tampered zip so notarization
# fails and the job stops before publish steps.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: notarize and verify, never create a GitHub Release or upload assets'
        required: true
        type: boolean
        default: true
      force_notary_fail:
        description: 'Submit an unsigned, tampered artifact so notarization fails and the job stops'
        required: false
        type: boolean
        default: false
      version:
        description: 'Marketing version to stamp on a dry-run build'
        required: false
        type: string
        default: '0.0.0'

permissions:
  contents: write

env:
  SCHEME: OpenHosts
  XCODE_VERSION: '26.0'

jobs:
  build-and-release:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check publish policy
        id: publish
        shell: bash
        env:
          # Boolean inputs are the strings "true"/"false" here. Tag pushes leave them empty.
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE_NOTARY_FAIL: ${{ inputs.force_notary_fail }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          DRY_RUN="${DRY_RUN:-false}"
          FORCE_NOTARY_FAIL="${FORCE_NOTARY_FAIL:-false}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" != "true" ]; then
            echo "workflow_dispatch requires dry_run=true."
            echo "Manual runs never create a GitHub Release or upload assets."
            exit 1
          fi
          if [ "$FORCE_NOTARY_FAIL" = "true" ] && [ "$DRY_RUN" != "true" ]; then
            echo "force_notary_fail=true is only allowed together with dry_run=true."
            exit 1
          fi
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ] && [ "$DRY_RUN" != "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "This run will publish a GitHub Release only after notarization and verification succeed."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Dry run: this job will not create a GitHub Release, upload assets, or update appcast.xml."
          fi
          echo "dry_run=${DRY_RUN} force_notary_fail=${FORCE_NOTARY_FAIL}"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

      - name: Install tools
        run: brew install xcodegen create-dmg

      - name: Extract version from tag
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN_VERSION: ${{ inputs.version || '0.0.0' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$DRY_RUN_VERSION"
            if [ -z "$VERSION" ]; then
              VERSION="0.0.0"
            fi
            TAG="v${VERSION}"
            BUILD_NUMBER=1
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            BUILD_NUMBER=$(printf '%s' "$VERSION" | tr -d '.')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Building version ${VERSION} (build ${BUILD_NUMBER}, tag ${TAG})"

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "actions" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "actions" "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Setup App Store Connect API key
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$ASC_API_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive
        run: |
          xcodebuild archive \
            -scheme "$SCHEME" \
            -archivePath "$RUNNER_TEMP/OpenHosts.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -configuration Release \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build_number }}" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Sign app bundle
        env:
          IDENTITY: "Developer ID Application"
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          APP="$RUNNER_TEMP/OpenHosts.xcarchive/Products/Applications/OpenHosts.app"

          # Resolve $(AppIdentifierPrefix) in helper entitlements
          sed "s/\$(AppIdentifierPrefix)/${TEAM_ID}./" \
            OpenHostsHelper/OpenHostsHelper.entitlements > "$RUNNER_TEMP/helper.entitlements"

          # Sign embedded frameworks (if any)
          if [ -d "$APP/Contents/Frameworks" ]; then
            find "$APP/Contents/Frameworks" \( -name "*.framework" -o -name "*.dylib" \) -exec \
              codesign --force --options runtime --sign "$IDENTITY" --timestamp {} \;
          fi

          # Sign the helper
          codesign --force --options runtime --sign "$IDENTITY" --timestamp \
            --entitlements "$RUNNER_TEMP/helper.entitlements" \
            "$APP/Contents/Library/LaunchDaemons/OpenHostsHelper"

          # Sign the widget extension
          codesign --force --options runtime --sign "$IDENTITY" --timestamp \
            --entitlements OpenHostsWidget/OpenHostsWidget.entitlements \
            "$APP/Contents/PlugIns/OpenHostsWidget.appex"

          # Sign the main app
          codesign --force --options runtime --sign "$IDENTITY" --timestamp \
            --entitlements OpenHosts/OpenHosts.entitlements \
            "$APP"

          # Verify
          codesign --verify --deep --strict "$APP"

          # Copy to export location
          mkdir -p "$RUNNER_TEMP/export"
          cp -R "$APP" "$RUNNER_TEMP/export/"

      - name: Notarize app
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          FORCE_NOTARY_FAIL: ${{ inputs.force_notary_fail }}
        run: |
          set -euo pipefail
          FORCE_NOTARY_FAIL="${FORCE_NOTARY_FAIL:-false}"
          APP="$RUNNER_TEMP/export/OpenHosts.app"
          KEY="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          SUBMIT="$RUNNER_TEMP/OpenHosts.zip"

          if [ "${FORCE_NOTARY_FAIL}" = "true" ]; then
            echo "force_notary_fail: stripping the signature and tampering the executable, then submitting that unsigned copy."
            TAMPERED="$RUNNER_TEMP/OpenHosts-tampered.app"
            rm -rf "$TAMPERED"
            ditto "$APP" "$TAMPERED"
            codesign --remove-signature "$TAMPERED"
            printf 'tampered-for-notary-failure\n' >> "$TAMPERED/Contents/MacOS/OpenHosts"
            if codesign --verify "$TAMPERED"; then
              echo "Tamper failed: the artifact submitted to notarytool is still signed."
              exit 1
            fi
            echo "Tampered artifact is unsigned. Submitting it to notarytool."
            SUBMIT="$RUNNER_TEMP/OpenHosts-tampered.zip"
            ditto -c -k --keepParent "$TAMPERED" "$SUBMIT"
          else
            ditto -c -k --keepParent "$APP" "$SUBMIT"
          fi

          LOG="$RUNNER_TEMP/notary-app.txt"
          set +e
          xcrun notarytool submit "$SUBMIT" \
            --key "$KEY" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 5m 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          set -e
          echo "notarytool (app) exit code: ${rc}"

          if [ "${FORCE_NOTARY_FAIL}" = "true" ]; then
            if [ "$rc" -eq 0 ] && grep -Eq 'status:[[:space:]]+Accepted' "$LOG"; then
              echo "ERROR: notarization accepted an unsigned, tampered artifact."
            else
              echo "Notarization rejected the unsigned, tampered artifact. Failing the job so the release cannot continue."
            fi
            exit 1
          fi

          if [ "$rc" -ne 0 ] || ! grep -Eq 'status:[[:space:]]+Accepted' "$LOG"; then
            echo "App notarization did not succeed. Refusing to staple or continue."
            SUB_ID=$(sed -n 's/^[[:space:]]*id:[[:space:]]*//p' "$LOG" | head -1 || true)
            if [ -n "${SUB_ID}" ]; then
              xcrun notarytool log "$SUB_ID" \
                --key "$KEY" \
                --key-id "$ASC_KEY_ID" \
                --issuer "$ASC_ISSUER_ID" || true
            fi
            exit 1
          fi

          xcrun stapler staple "$APP"

      - name: Create DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          create-dmg \
            --volname "OpenHosts" \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "OpenHosts.app" 175 190 \
            --app-drop-link 425 190 \
            --hide-extension "OpenHosts.app" \
            "OpenHosts-${VERSION}.dmg" \
            "$RUNNER_TEMP/export/" \
          || true  # create-dmg returns 2 on success with background image warnings

          test -f "OpenHosts-${VERSION}.dmg"

      - name: Notarize DMG
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          DMG="OpenHosts-${VERSION}.dmg"
          KEY="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          LOG="$RUNNER_TEMP/notary-dmg.txt"

          set +e
          xcrun notarytool submit "$DMG" \
            --key "$KEY" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 5m 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          set -e
          echo "notarytool (dmg) exit code: ${rc}"

          if [ "$rc" -ne 0 ] || ! grep -Eq 'status:[[:space:]]+Accepted' "$LOG"; then
            echo "DMG notarization did not succeed. Refusing to staple or continue."
            SUB_ID=$(sed -n 's/^[[:space:]]*id:[[:space:]]*//p' "$LOG" | head -1 || true)
            if [ -n "${SUB_ID}" ]; then
              xcrun notarytool log "$SUB_ID" \
                --key "$KEY" \
                --key-id "$ASC_KEY_ID" \
                --issuer "$ASC_ISSUER_ID" || true
            fi
            exit 1
          fi

          xcrun stapler staple "$DMG"

      - name: Verify stapled app ticket
        shell: bash
        run: |
          set -euo pipefail
          echo "xcrun stapler validate app"
          xcrun stapler validate "$RUNNER_TEMP/export/OpenHosts.app"

      - name: Verify stapled DMG ticket
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "xcrun stapler validate DMG"
          xcrun stapler validate "OpenHosts-${VERSION}.dmg"

      - name: Assess app with Gatekeeper
        shell: bash
        run: |
          set -euo pipefail
          echo "spctl -a -vvv -t exec app"
          spctl -a -vvv -t exec "$RUNNER_TEMP/export/OpenHosts.app"

      - name: Assess DMG with Gatekeeper
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "spctl -a -vvv -t open --context context:primary-signature DMG"
          spctl -a -vvv -t open --context context:primary-signature "OpenHosts-${VERSION}.dmg"

      - name: Show code signatures and entitlements
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/export/OpenHosts.app"
          HELPER="$APP/Contents/Library/LaunchDaemons/OpenHostsHelper"
          WIDGET="$APP/Contents/PlugIns/OpenHostsWidget.appex"
          for target in "$APP" "$HELPER" "$WIDGET"; do
            echo "===== codesign -dv --verbose=4 ${target} ====="
            codesign -dv --verbose=4 "$target"
            echo "===== codesign -d --entitlements :- ${target} ====="
            codesign -d --entitlements :- "$target"
          done

      - name: Generate checksum
        if: steps.publish.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: shasum -a 256 "OpenHosts-${VERSION}.dmg" > "OpenHosts-${VERSION}.dmg.sha256"

      - name: Sign update with Sparkle EdDSA key
        id: sparkle_sign
        if: steps.publish.outputs.publish == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SIGN_UPDATE="$RUNNER_TEMP/DerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update"
          if [ ! -x "$SIGN_UPDATE" ]; then
            SIGN_UPDATE=$(find "$RUNNER_TEMP/DerivedData" -name "sign_update" -type f 2>/dev/null | head -1)
          fi
          echo "Using sign_update at: $SIGN_UPDATE"

          KEY_FILE="$RUNNER_TEMP/sparkle_ed_private_key"
          printf "%s" "$SPARKLE_ED_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          SIGNATURE=$("$SIGN_UPDATE" -f "$KEY_FILE" "OpenHosts-${VERSION}.dmg")
          rm -f "$KEY_FILE"

          echo "signature=$SIGNATURE" >> "$GITHUB_OUTPUT"
          echo "Signature generated (length: ${#SIGNATURE})"

      - name: Create GitHub Release
        if: steps.publish.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "Refusing to create a GitHub Release or upload assets."
            exit 1
          fi
          gh release create "$TAG" \
            "OpenHosts-${VERSION}.dmg" \
            "OpenHosts-${VERSION}.dmg.sha256" \
            --title "OpenHosts ${VERSION}" \
            --generate-notes

      - name: Update appcast.xml
        if: steps.publish.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build_number }}
          SIGNATURE: ${{ steps.sparkle_sign.outputs.signature }}
        run: |
          PUB_DATE=$(LC_TIME=en_US.UTF-8 date -u "+%a, %d %b %Y %H:%M:%S +0000")
          RELEASE_URL="https://github.com/debuginn/OpenHosts/releases/download/${TAG}/OpenHosts-${VERSION}.dmg"
          RELEASE_NOTES_URL="https://github.com/debuginn/OpenHosts/releases/tag/${TAG}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main

          export PUB_DATE RELEASE_URL RELEASE_NOTES_URL
          python3 - <<'PY'
          import os, re, sys
          version = os.environ["VERSION"]
          build = os.environ["BUILD"]
          signature = os.environ["SIGNATURE"]
          pub_date = os.environ["PUB_DATE"]
          release_url = os.environ["RELEASE_URL"]
          release_notes_url = os.environ["RELEASE_NOTES_URL"]

          new_item = (
              f'        <item>\n'
              f'            <title>Version {version}</title>\n'
              f'            <link>{release_notes_url}</link>\n'
              f'            <sparkle:version>{build}</sparkle:version>\n'
              f'            <sparkle:shortVersionString>{version}</sparkle:shortVersionString>\n'
              f'            <sparkle:minimumSystemVersion>26.0</sparkle:minimumSystemVersion>\n'
              f'            <pubDate>{pub_date}</pubDate>\n'
              f'            <enclosure url="{release_url}" type="application/octet-stream" {signature}/>\n'
              f'        </item>'
          )

          with open("appcast.xml", "r") as f:
              content = f.read()

          marker = "<!-- Release entries will be prepended here by CI -->"
          if marker in content:
              replacement = new_item + "\n        " + marker
              content = content.replace(marker, replacement, 1)
          else:
              content = content.replace("</channel>", new_item + "\n    </channel>", 1)

          with open("appcast.xml", "w") as f:
              f.write(content)
          PY

          git add appcast.xml
          git commit -m "chore(release): update appcast for ${TAG}"
          git push origin main

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/private_keys" 2>/dev/null || true
